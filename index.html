<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Meta Tags -->
    <title>Aditya Meenakshisundaram | Chemical Engineering Student at Texas A&M</title>
    <meta name="description" content="Honors Chemical Engineering student at Texas A&M focused on semiconductors, advanced materials, and sustainable energy systems. Samsung Semiconductor Fellow." />
    <meta name="keywords" content="Chemical Engineering, Semiconductors, Materials Science, Texas A&M, Samsung Fellow, Silicon Carbide, Sustainable Energy" />
    <meta name="author" content="Aditya Meenakshisundaram" />

    <!-- Canonical URL -->
    <link rel="canonical" href="%VITE_SITE_URL%" />

    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="Aditya Meenakshisundaram | Chemical Engineering Student" />
    <meta property="og:description" content="Honors Chemical Engineering student at Texas A&M focused on semiconductors, advanced materials, and sustainable energy systems." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%VITE_SITE_URL%" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Aditya Meenakshisundaram | Chemical Engineering Student" />
    <meta name="twitter:description" content="Honors Chemical Engineering student at Texas A&M focused on semiconductors, advanced materials, and sustainable energy systems." />
    <meta name="twitter:url" content="%VITE_SITE_URL%" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#fffaf0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141011" media="(prefers-color-scheme: dark)" />

    <!-- Apply saved / system theme before first paint -->
    <script>
      (function () {
        var t = null;
        try { t = localStorage.getItem('theme'); } catch (e) {}
        if (t !== 'dark' && t !== 'light') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
